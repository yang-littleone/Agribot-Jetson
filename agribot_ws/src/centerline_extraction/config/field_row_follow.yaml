# 正式试验前必须用卷尺更新 platform_width、desired_row_separation 和
# plant_safety_clearance；摸底试验完成后复制本文件并锁定，不得边测试边调参。
corn_row_detector_projection:
  ros__parameters:
    point_cloud_topic: /livox/lidar  # 输入三维点云话题
    base_frame: base_link            # 点云裁剪、分行和拟合使用的车体坐标系
    output_frame: odom               # 发布给控制器的中心线目标坐标系

    # base_frame下的点云感兴趣区域和降采样参数，单位均为m。
    z_min: 0.10                      # 去除包3中占主导的近地面扫描弧线
    z_max: 0.50                      # 保留低位茎秆回波，避免高位叶片大量混入
    voxel_size: 0.025                # 体素降采样叶边长
    x_min: 0.10                      # 车体前方ROI起点
    x_max: 2.20                      # 车体前方ROI终点
    y_min: -1.40                     # ROI右侧边界（车体y负方向）
    y_max: 1.40                      # ROI左侧边界（车体y正方向）
    path_length: 2.00                # 向前生成中心线和边界的长度
    path_step: 0.10                  # 中心线、边界离散点间距

    # 示例起始值，不是实测值。安全阈值定义：
    # error_budget = row_width/2 - platform_width/2 - plant_safety_clearance
    platform_width: 0.22             # 小车最大外廓宽度
    desired_row_separation: 0.62     # 包3现场卷尺测得的左右植株行近似行距
    plant_safety_clearance: 0.05     # 车体外缘到植株的期望最小间隙
    min_row_separation: 0.50         # 0.62 m实测行距下拒绝把相邻植株误配成过窄通道
    max_row_separation: 0.75         # 接受双行模型的最大行距

    # 分段观测、内侧植株行提取和稳健拟合。
    section_width: 0.25              # 每个路径采样点统计点云的前后窗口宽度
    min_section_points: 3            # 单侧分段形成有效观测所需的最少点数
    robust_fit_residual_threshold: 0.12  # 稳健直线拟合保留内点的最大横向残差
    min_cluster_size: 10             # 单侧内行可用于中心线拟合的最少总点数
    innermost_bin_width: 0.20        # 沿前进方向选取内侧种子的分箱宽度
    innermost_row_band_width: 0.18   # 保留内侧拟合直线周围点的横向带宽
    innermost_quantile: 0.20         # 每个分箱选内侧横向分位数，范围限制为0～0.5
    min_innermost_seeds: 4           # 拟合一侧内行所需的最少分箱种子数
    use_constrained_row_pair: true   # 用行距约束联合选择左右高密度带，避免内外行被地面/叶片粘连
    row_histogram_bin_width: 0.025   # 双行搜索的横向直方图分辨率
    row_peak_half_width: 0.055       # 双峰确定后保留的单侧横向半带宽
    row_yaw_search_step: 0.01        # 联合搜索行方向的角度步长（rad）
    row_pair_width_penalty: 80.0     # 候选行距偏离期望行距时的评分惩罚系数
    max_row_alignment_yaw: 0.70      # 允许恢复的最大车体/作物行夹角，约40°，超过即拒绝识别
    row_yaw_prior_tolerance: 0.15    # 已锁定全局行方向后，局部航向搜索的半窗口（rad）
    row_coverage_bin_width: 0.25     # 沿前进方向评价植株行连续覆盖的分箱宽度
    row_coverage_min_points: 3       # 一个纵向分箱被视为有效支撑所需的最少点数
    row_min_coverage_ratio: 0.35     # 单侧植株行最少有效纵向分箱比例
    row_min_longitudinal_span: 1.00  # 单侧候选至少覆盖的前向长度，抑制两株横向误配
    row_coverage_score_weight: 50.0  # 候选评分中纵向覆盖率的奖励权重

    # 方法开关用于正式方法和离线消融，正式试验开始后不得临时切换。
    enable_innermost_row_extraction: true  # 是否先提取左右最近的内侧植株行
    enable_robust_refinement: true         # 是否按残差剔除离群点后重新拟合
    use_parallel_row_model: true           # 是否用共享斜率约束左右行为平行模型
    enable_temporal_tracking: true         # 是否使用上一帧模型约束和短时保持
    enable_quality_evaluation: true        # 是否计算并发布质量置信度；false时发布1
    use_row_yaw_estimation: true           # 是否估计行方向并旋转到行坐标系处理
    line_filter_alpha: 0.25                # 新测直线/行航向的滤波权重，越大响应越快
    max_line_lateral_jump: 0.18            # 相邻帧单侧直线允许的最大横向跳变
    max_row_width_jump: 0.20               # 相邻帧实际行距允许的最大跳变
    max_row_yaw_jump: 0.35                 # 相邻帧行航向允许的最大跳变（rad）
    max_line_lost_frames: 5                # 测量失效后继续保持历史双行模型的最大帧数
    time_window_size: 3                    # 发布路径参与时序平均的历史帧窗口长度

    # 五个质量分量的融合权重；源码会将非负权重自动归一化。
    quality_support_weight: 0.30           # 双侧分段点数支持度权重
    quality_observation_weight: 0.20       # 双侧观测完整性权重
    quality_width_weight: 0.20             # 实际行距与期望行距一致性权重
    quality_residual_weight: 0.15          # 分段观测与拟合直线残差权重
    quality_safety_weight: 0.15            # 车体安全裕度权重
    quality_observation_fallback_score: 0.45  # 分段缺少完整实测而用拟合值时的观测得分

    # 地头检测：路径无效/过短、任一侧点数不足或置信度过低，
    # 任一条件连续约0.6 s成立后确认。
    enable_headland_detection: true            # 是否启用地头候选检测
    headland_low_confidence_threshold: 0.35    # 低于该置信度时视为地头候选
    headland_min_side_points: 80               # 任一侧点数低于该值时视为支撑不足
    headland_min_path_points: 5                # 中心线路径点少于该值时视为路径过短
    headland_candidate_frames: 6               # 连续候选帧达到该值才确认地头

pid_controller:
  ros__parameters:
    # 摸底起点：较长前视距离降低局部中心线小幅跳动对转向的放大。
    target_distance: 0.20              # 行间跟踪时从最近路径点向前选取目标的距离（m）
    # 摸底试验确认0.10 m/s不足以克服实车低速死区，正式名义速度锁定为0.18 m/s。
    # field_path_tracking.launch.py 无参数启动时仍会安全覆盖为0.05 m/s。
    max_linear_speed: 0.18             # 正常直行名义线速度上限（m/s）
    min_linear_speed: 0.03             # 非停车状态下经质量缩放后的基础最低线速度（m/s）
    max_angular_speed: 0.60            # PID角速度绝对值上限（rad/s）
    max_angular_acceleration: 0.80     # 相邻控制周期角速度变化率上限（rad/s²）
    angular_command_deadband: 0.02     # 小于该值的PID目标角速度置零（rad/s）
    lateral_kp: 1.00                   # 横向误差PID比例增益
    lateral_ki: 0.00                   # 横向误差PID积分增益
    lateral_kd: 0.10                   # 横向误差PID微分增益
    heading_kp: 1.00                   # 航向误差PID比例增益
    heading_ki: 0.00                   # 航向误差PID积分增益
    heading_kd: 0.00                   # 航向误差PID微分增益

    use_quality_aware_control: true     # true让置信度和安全裕度参与调速、限转及停车
    require_quality_metrics: true       # true时未收到置信度或安全裕度即保持停车
    confidence_high_threshold: 0.75    # 高置信度参考阈值；当前PID流程读取但未直接使用
    confidence_low_threshold: 0.45     # 低于该值进入历史中心线短时恢复逻辑
    confidence_stop_threshold: 0.25    # 低于该值不允许历史中心线恢复，立即停车
    confidence_min_speed_factor: 0.20  # 质量调速时置信度速度因子的下限
    max_low_confidence_duration: 0.50  # 历史中心线允许维持的最长低置信度时间（s）
    centerline_timeout: 0.50           # 中心线超过该时间未更新则停车（s）
    quality_timeout: 0.50              # 质量指标超过该时间未更新则停车（s）

    # 下面三项须依据实测车宽、行距和安全间隙在摸底试验中锁定。
    safety_margin_high: 0.15           # 低于该裕度开始轻度降速和降低角速度上限（m）
    safety_margin_mid: 0.125           # 低于该裕度进一步降速和降低角速度上限（m）
    safety_margin_stop: 0.10           # 行间跟踪低于该裕度立即停车（m）

    # 0表示不按里程计累计距离自动停车；5 m场地终点由人工停车/急停控制。
    max_row_follow_distance: 0.0       # 本次行间跟踪累计距离上限（m），0表示禁用
    max_row_follow_time: 180.0         # 从首条有效中心线起计的运行时间上限（s），0禁用
    stop_at_path_end: false            # 是否按局部中心线最后一点自动停车，田间应保持false

    # 地头U形换行。当前配置用于5 m、0.60 m行距模拟场地的单次左转摸底。
    enable_headland_turn: false                 # 是否允许收到地头信号后自动掉头
    headland_min_follow_distance: 1.50         # 每次掉头前必须完成的最小行间行驶距离（m）
    headland_row_spacing: 0.60                 # 相邻两行中心线间距（m）
    # <=0时源码自动采用 headland_row_spacing / 2，即当前为0.30 m。
    headland_turn_radius: 0.0                  # U形轨迹半径（m），0表示按行距的一半自动计算
    headland_exit_distance: 0.15               # 触发掉头后沿当前行方向继续前进的距离（m）
    headland_settle_distance: 0.60             # 完成180°转向后的直线稳定段长度（m）
    headland_path_step: 0.05                   # 掉头及重捕获参考路径的采样间距（m）

    # 标准半圆对当前0.60 m行距的曲率要求低于现有连续曲率轨迹。
    headland_use_continuous_curvature_turn: false  # true使用平滑曲线，false使用标准半圆
    # 仅在 headland_use_continuous_curvature_turn=true 时使用。
    headland_turn_forward_extension: 0.30      # 平滑掉头曲线向地头前方伸出的最大距离（m）
    headland_turn_use_safety_margin_speed: true  # 掉头时是否根据通道安全裕度降低速度

    headland_turn_goal_tolerance: 0.20         # 判断到达掉头终点的位置容差（m）
    headland_turn_heading_tolerance: 0.35      # 判断掉头完成的航向容差（rad）
    headland_turn_direction: left             # 第一次掉头方向：left或right，之后自动交替
    max_headland_turns: 1                     # 本次运行允许的最大掉头次数，<=0表示不限制
    headland_turn_linear_speed: 0.15           # U_TURN状态下的线速度上限（m/s）
    headland_turn_target_distance: 0.20        # U_TURN状态下使用的路径前视距离（m）

    # 掉头完成后的相邻行预测跟踪和实测中心线重捕获。
    headland_reacquire_confidence: 0.70        # 高于该置信度才计为一次稳定重捕获
    headland_reacquire_track_confidence: 0.35  # 高于该置信度即可融合实测下一行中心线
    headland_reacquire_search_speed: 0.15      # NEXT_ROW_REACQUIRE状态的线速度上限（m/s）
    headland_reacquire_search_angular_speed: 0.0  # 无预测和实测路径时使用的备用角速度（rad/s）
    headland_reacquire_max_distance: 1.20      # 允许搜索下一行的最大累计距离（m）
    headland_reacquire_max_time: 8.0           # 允许搜索下一行的最长时间（s）
    headland_reacquire_prediction_length: 1.50 # 掉头后生成的预测中心线长度（m）
    headland_reacquire_frames: 5               # 连续满足高置信度的帧数达到该值才恢复行间跟踪

    debug_mode: false                  # true时忽略PID并固定发布0.1 m/s直行，仅限架空调试

field_trial_logger:
  ros__parameters:
    sample_period: 0.05                 # CSV记录周期（s），0.05对应约20 Hz
    controller_node: /pid_controller    # 读取并保存控制器参数快照的节点名
    detector_node: /corn_row_detector_projection  # 读取并保存感知参数快照的节点名
    output_dir: field_trial_results      # 默认结果根目录；田间launch通常会自动覆盖为U盘
