# 原始里程计方案：轮速提供平面速度，H30提供相对yaw。
# 此模式不使用FAST-LIO，由EKF直接发布/odometry/filtered和
# odom -> base_footprint。

ekf_filter_node:
  ros__parameters:
    frequency: 20.0             # EKF输出频率，Hz
    sensor_timeout: 1.5         # 输入超时后仅预测的等待时间，s
    two_d_mode: true            # 只估计平面运动
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false
    publish_tf: true            # legacy模式由EKF直接发布最终TF
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 原始轮速里程计：只融合vx、vy和绕Z轴角速度。
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 5
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # H30/板载IMU选择器输出：只作为相对yaw来源。
    imu0: /imu/selected
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 5
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_pose_rejection_threshold: 20.0
    imu0_twist_rejection_threshold: 1.542
    imu0_linear_acceleration_rejection_threshold: 10.0
    imu0_remove_gravitational_acceleration: true

    use_control: false
