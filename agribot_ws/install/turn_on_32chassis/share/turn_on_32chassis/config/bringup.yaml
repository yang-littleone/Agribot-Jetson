# Parameters for turn_on_32chassis.launch.py.
#
# Values under "launch" select the data path and provide the defaults for
# launch arguments. Values under each ROS node use the standard
# ros__parameters layout. Command-line launch arguments still take precedence.

launch:
# imu_source_selector parameters:h30 or onboard
  imu_source: h30       
  start_h30_driver: true
  h30_topic: /imu/data_h30  #在h30的驱动文件中定义了其topic为/imu/data_h30,所以这里也要改成/imu/data_h30,否则会报错
  h30_serial_port: /dev/wheeltec_IMU  #在h30的驱动文件中定义了其serial_port为/dev/wheeltec_IMU
  h30_baud_rate: 460800
  h30_frame_id: gyro_link  #在h30的驱动文件中定义了其frame_id为gyro_link,所以这里也要改成gyro_link,否则会报错
  onboard_imu_tf:
    parent_frame: base_link
    child_frame: imu_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

turn_on_32chassis_node:
  ros__parameters:
    odom_frame_id: odom
    robot_frame_id: base_footprint
    # This is the frame of the chassis controller's onboard IMU data.
    gyro_frame_id: imu_link

yesense_pub:
  ros__parameters:
    driver_type: ros_serial
    imu_topic: imu_data

imu_source_selector:
  ros__parameters:
    # Used only when the incoming H30 message has zero covariance entries.
    orientation_variance: 0.0025
    angular_velocity_variance: 0.0004
    linear_acceleration_variance: 0.04
